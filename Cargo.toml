[package]
name = "libtsx"
version = "0.1.0"
edition = "2024"
description = "TSX/TypeScript boundary crate: oxc-backed parser plus the owned, serde-serializable DagNode code-graph contract"

[features]
default = ["parse"]
# The oxc-backed TSX parser. Disable (default-features = false) to consume
# only the dependency-free `dag` types.
parse = ["dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_parser", "dep:oxc_span"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

oxc_allocator = { version = "0.139.0", optional = true }
oxc_ast = { version = "0.139.0", optional = true }
oxc_parser = { version = "0.139.0", optional = true }
oxc_span = { version = "0.139.0", optional = true }

[dev-dependencies]
serde_json = "1.0"
