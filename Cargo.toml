[package]
name = "libtsx"
version = "0.1.0"
edition = "2024"
description = "TSX/TypeScript boundary crate: oxc-backed parser plus the owned, serde-serializable DagNode code-graph contract"

[features]
default = ["parse"]
# The oxc-backed TSX parser + the TS->JS type-strip transpiler. Disable
# (default-features = false) to consume only the dependency-free `dag` types.
parse = [
    "dep:oxc_allocator",
    "dep:oxc_ast",
    "dep:oxc_parser",
    "dep:oxc_span",
    "dep:oxc_semantic",
    "dep:oxc_transformer",
    "dep:oxc_codegen",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

oxc_allocator = { version = "0.139.0", optional = true }
oxc_ast = { version = "0.139.0", optional = true }
oxc_parser = { version = "0.139.0", optional = true }
oxc_span = { version = "0.139.0", optional = true }
# TS -> JS type-strip transpile (the module runtime's front end, MODULE_PLAN
# M1). `transpile_ts` parses TS, runs the oxc TypeScript transform to erase
# type nodes, and re-emits JavaScript. All three stay behind the owned
# `transpile_ts` API — no `oxc_*` type is exposed (the quarantine, PLAN §4).
oxc_semantic = { version = "0.139.0", optional = true }
oxc_transformer = { version = "0.139.0", optional = true }
oxc_codegen = { version = "0.139.0", optional = true }

[dev-dependencies]
serde_json = "1.0"
